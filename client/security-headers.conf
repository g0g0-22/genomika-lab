# Included by every location that sets its own headers: nginx discards
# server-level add_header directives in any location that declares one, so a
# header set only once at the top would silently vanish from those responses.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Everything the site loads comes from its own origin, fonts included.
# style-src allows inline styles because React renders style={{…}} attributes;
# no inline script is permitted, and none is needed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
