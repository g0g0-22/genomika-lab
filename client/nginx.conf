# Web tier. Serves the built React application and forwards /api to the
# application tier. Nothing here knows anything about the application except
# where to reach it.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the upstream per request rather than
    # once at startup means a restarted api container is picked up without
    # restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/calendar
        application/javascript
        application/json
        application/x-bibtex
        image/svg+xml;

    # ---------------------------------------------------------------- API --
    location /api/ {
        set $api_upstream api:4000;
        proxy_pass http://$api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CV uploads arrive as base64 inside JSON, so the body is larger than
        # the 4 MB file cap the application enforces.
        client_max_body_size 8m;
        proxy_read_timeout   60s;
    }

    # ------------------------------------------------------------- ASSETS --
    # Vite content-hashes these filenames, so a given URL can never change
    # contents and is safe to cache indefinitely.
    location /assets/ {
        # One header, not two: `expires` would emit its own Cache-Control
        # alongside this one.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------- SPA --
    # Any unknown path is a client-side route: hand back the shell and let
    # React Router resolve it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell itself must never be cached, or a deployment is invisible to
    # anyone holding a stale copy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
