# GenomikaLab — two tiers.
#
#   web : nginx. Serves the built React application, compresses it, sets cache
#         policy, and forwards /api to the application tier.
#   api : node. Application logic and the SQLite database. Never exposed
#         directly; only reachable from web over the internal network.
#
# RepoRun exposes `web` (see stack.yml); `api` has no ingress of its own.
#
# RepoRun's rules, which this file follows: every service sets cpus and
# mem_limit; no restart policy (the platform supervises); no named volumes —
# persistent state is a bind mount of a repo-relative folder, ./data.

services:
  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    cpus: 0.1
    mem_limit: 64m
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    environment:
      # Optional extra proxy ranges whose X-Forwarded-For nginx may believe.
      # Proxies on the container's own networks are trusted automatically.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    cpus: 0.4
    mem_limit: 256m
    environment:
      NODE_ENV: production
      TZ: Europe/Skopje
      PORT: 4000
      DB_PATH: /data/genomika.db
      UPLOAD_DIR: /data/uploads
      # Required. Compose refuses to start the stack if it is unset, rather
      # than substituting a value that is public in this repository.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in a .env file or the environment}
      # Set to "false" to deploy with an empty database instead of demo content.
      AUTO_SEED: ${AUTO_SEED:-true}
      # Passwords for the seeded administrator and researcher accounts. Unset,
      # each is generated on first boot and printed once in this service's log.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      # Which accounts the login page lists, with their password:
      # none (default), researcher, or all. Admin is listed only with "all".
      DEMO_LOGINS: ${DEMO_LOGINS:-none}
    volumes:
      # The SQLite file and uploaded CVs. A folder beside the checkout rather
      # than inside an image, so a rebuild or redeploy keeps every booking,
      # application and message.
      - ./data:/data
    expose:
      - "4000"
