# GenomikaLab — two tiers.
#
#   web : nginx. Serves the built React application, compresses it, sets cache
#         policy, and forwards /api to the application tier.
#   api : node. Application logic and the SQLite database. Never exposed
#         directly; only reachable from web over the internal network.
#
# RepoRun exposes `web` (see stack.yml); `api` has no ingress of its own.

services:
  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_PATH: /data/genomika.db
      UPLOAD_DIR: /data/uploads
      # Required. Compose refuses to start the stack if it is unset, rather
      # than substituting a value that is public in this repository.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in a .env file or the environment}
      # Set to "false" to deploy with an empty database instead of demo content.
      AUTO_SEED: ${AUTO_SEED:-true}
    volumes:
      - genomika-data:/data
    expose:
      - "4000"

volumes:
  # Survives `docker compose down`, so bookings, applications and messages
  # submitted during review are still there after a redeploy.
  genomika-data:
